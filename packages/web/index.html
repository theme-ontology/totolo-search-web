<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search · Theme Ontology</title>
  <meta name="description" content="Fast in-browser hybrid search over the Theme Ontology: themes, stories, and annotations.">
  <meta property="og:title" content="Theme Ontology Search">
  <meta property="og:description" content="Fast in-browser hybrid search over the Theme Ontology: themes, stories, and annotations.">
  <meta property="og:url" content="https://uat.themeontology.org/search/">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      background: #f8f9fa;
      color: #212529;
      min-height: 100vh;
    }

    #app { max-width: 860px; margin: 0 auto; padding: 1.5rem 1rem; position: relative; }

    /* Top nav — kept in sync with packages/indexer/src/pages.ts (framework-free) */
    .nav { background: #fff; border-bottom: 1px solid #dee2e6; }
    .nav-inner { max-width: 1140px; margin: 0 auto; padding: .55rem 1rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .nav-brand { display: flex; align-items: center; gap: .5rem; font-weight: 700; font-size: 1.05rem; letter-spacing: -.3px; color: #111; text-decoration: none; }
    .nav-brand img { display: block; }
    .nav-links { display: flex; align-items: center; gap: 1.25rem; margin-left: auto; }
    .nav-links a { color: #495057; text-decoration: none; font-size: .9rem; font-weight: 500; }
    .nav-links a:hover { color: #111; }
    .nav-links a.active { color: #111; font-weight: 600; }
    .nav-links .ext-mark { font-size: .8em; color: #adb5bd; }
    .nav-main { margin-left: 1.5rem; flex: 1; }
    .nav-main .nav-versions { margin-left: auto; }
    .nav-links a.nav-search { color: #212529; background: #fff; border: 1px solid #ced4da; font-weight: 600; padding: .3rem .9rem; border-radius: 6px; }
    .nav-links a.nav-search:hover, .nav-links a.nav-search.active { color: #111; background: #f8f9fa; border-color: #868e96; }
    .nav-toggle { display: none; }
    .nav-burger { display: none; margin-left: auto; cursor: pointer; font-size: 1.4rem; line-height: 1; color: #495057; user-select: none; padding: .1rem .3rem; }
    @media (max-width: 640px) {
      .nav-burger { display: inline-flex; }
      .nav-links { display: none; width: 100%; flex-direction: column; align-items: flex-start; gap: .6rem; margin: .4rem 0 .2rem; }
      .nav-toggle:checked ~ .nav-links { display: flex; }
      /* Open burger menu: a plain, full-width, left-aligned column flush under the brand
         (title + icon). Reset every desktop horizontal-bar spacing rule, and drop the
         Search "pill" so all items read as plain left-aligned links. */
      .nav-inner { align-items: flex-start; }
      .nav-main { margin: 0; flex: none; }
      .nav-main .nav-versions { margin-left: 0; }
      .nav-links a { margin: 0; width: 100%; padding: .35rem 0; }
      .nav-links a.nav-search { background: none; border: 0; border-radius: 0; padding: .35rem 0; color: #495057; font-weight: 500; }
      .nav-links a.nav-search.active { color: #111; }
    }

    #app > header { margin-bottom: 1.5rem; }

    h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 1rem; color: #111; }

    .search-row {
      display: flex;
      gap: .5rem;
    }

    #query {
      flex: 1;
      padding: .65rem 1rem;
      font-size: 1rem;
      border: 1.5px solid #ced4da;
      border-radius: 6px;
      outline: none;
      background: #fff;
      transition: border-color .15s;
    }
    #query:focus { border-color: #495057; }
    #query:disabled { opacity: .5; cursor: not-allowed; }

    #search-btn {
      padding: .65rem 1.1rem;
      font-size: .9rem;
      font-weight: 600;
      background: #495057;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    #search-btn:hover:not(:disabled) { background: #343a40; }
    #search-btn:disabled { opacity: .5; cursor: not-allowed; }

    .search-options {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: .45rem;
      font-size: .82rem;
      color: #495057;
    }
    .type-filter { display: flex; gap: .6rem; flex-wrap: wrap; }
    .type-filter label { display: flex; align-items: center; gap: .25rem; cursor: pointer; }
    .type-filter input[type=radio] { accent-color: #495057; }

    .right-options {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-left: auto;
    }
    .regex-label {
      display: flex;
      align-items: center;
      gap: .25rem;
      cursor: pointer;
      color: #6c757d;
    }
    .regex-label input[type=checkbox] { accent-color: #495057; }

    .status { font-size: .8rem; color: #6c757d; margin-top: .4rem; min-height: 1.2em; }
    .status.error { color: #dc3545; }

    #overall-progress {
      margin-top: .4rem;
      height: 5px;
      background: #dee2e6;
      border-radius: 3px;
      overflow: hidden;
    }
    #overall-fill {
      height: 100%;
      background: #495057;
      transition: width .3s ease;
      width: 0%;
    }

    #progress { margin-top: .35rem; }
    .progress-label { font-size: .75rem; color: #6c757d; margin-bottom: .25rem; }
    .progress-track { height: 4px; background: #dee2e6; border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: #adb5bd; transition: width .1s; }

    main { margin-top: 1.5rem; }

    .result-count {
      font-size: .8rem;
      color: #6c757d;
      margin-bottom: .75rem;
    }
    .result-count:empty { display: none; }

    #retry-btn {
      margin-top: .4rem;
      padding: .35rem .9rem;
      font-size: .85rem;
      font-weight: 600;
      background: #495057;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #retry-btn:hover:not(:disabled) { background: #343a40; }
    #retry-btn:disabled { opacity: .5; cursor: wait; }

    /* Results header: count on the left, the three search-phase pills on the right */
    .results-header {
      display: flex;
      align-items: center;
      gap: .6rem;
      flex-wrap: wrap;
      margin-bottom: .75rem;
      min-height: 1.2em;
    }
    .result-count { margin-bottom: 0; }
    .search-phases { display: flex; gap: .3rem; margin-left: auto; }
    .search-phases:empty { display: none; }
    .phase-pill {
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: .12em .5em;
      border-radius: 3px;
      background: #f1f3f5;
      color: #ced4da;               /* light gray = not yet applied */
      transition: color .2s, background .2s;
    }
    .phase-pill.is-active {
      background: #e9ecef;
      color: #495057;               /* darkened = applied */
    }

    /* Subtle background indicator while the semantic model loads — tucked into the top-right
       of the content area, below the nav bar, so it stays out of the way. Transient and
       non-interactive (clicks pass through), anchored to #app so it never overlaps the nav. */
    .semantic-loading {
      display: none;
      position: absolute;
      top: 1.5rem;
      right: 1rem;
      z-index: 5;
      pointer-events: none;
      align-items: center;
      gap: .35rem;
      font-size: .72rem;
      color: #adb5bd;
    }
    .semantic-loading.visible { display: inline-flex; }
    .semantic-spinner {
      width: 13px;
      height: 13px;
      border: 2px solid #dee2e6;
      border-top-color: #adb5bd;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .result {
      position: relative;
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: .85rem 1rem;
      margin-bottom: .6rem;
      border-left: 3px solid transparent;
    }
    .result.type-theme       { border-left-color: #6c757d; }
    .result.type-story       { border-left-color: #0d6efd; }
    .result.type-collection  { border-left-color: #198754; }
    .result.type-story-theme { border-left-color: #9c36b5; }

    .result-header {
      display: flex;
      align-items: baseline;
      gap: .5rem;
      flex-wrap: wrap;
      margin-bottom: .35rem;
      padding-right: 1.4rem;  /* clearance for the copy icon pinned top-right */
    }

    .result-type {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #6c757d;
      padding: .1em .35em;
      background: #f1f3f5;
      border-radius: 3px;
      flex-shrink: 0;
      min-width: 5.5em;
      text-align: center;
    }

    /* Link kinds: stories are blue, themes are violet, so the two read distinctly. */
    .result-name {
      font-weight: 600;
      font-size: .95rem;
      color: #0d6efd;
      text-decoration: none;
    }
    .result-name:hover { text-decoration: underline; }
    .result-name.is-theme { color: #7048e8; }

    /* Copy-name button: pinned to the upper-right of the result box; flashes a green
       check on copy. */
    .result-copy {
      position: absolute;
      top: .55rem;
      right: .55rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      border: none;
      background: none;
      color: #adb5bd;
      cursor: pointer;
      border-radius: 4px;
      line-height: 0;
      transition: color .15s, background .15s;
    }
    .result-copy:hover { color: #495057; background: #f1f3f5; }
    .result-copy svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .result-copy .icon-check { display: none; }
    .result-copy.copied { color: #2f9e44; }
    .result-copy.copied .icon-copy { display: none; }
    .result-copy.copied .icon-check { display: inline; }

    /* Annotation header: story + theme as equal links, smaller so both fit nicely. */
    .result-annotation-link {
      font-weight: 600;
      font-size: .85rem;
      text-decoration: none;
    }
    .result-annotation-link:hover { text-decoration: underline; }
    .result-annotation-link.is-story { color: #0d6efd; }
    .result-annotation-link.is-theme { color: #7048e8; }

    .result-title { font-size: .85rem; color: #495057; font-style: italic; }

    /* Parent themes: links in a muted violet — clearly themes, but less intrusive
       than the main theme name. */
    .result-parents { font-size: .78rem; color: #adb5bd; }
    .result-parent { color: #9b8bd4; text-decoration: none; }
    .result-parent:hover { color: #7048e8; text-decoration: underline; }
    .result-parent-sep { color: #c4b9e8; }
    .result-date { font-size: .82rem; color: #6c757d; }

    .result-desc, .result-snippet {
      font-size: .85rem;
      color: #495057;
      line-height: 1.5;
    }
    .result-snippet { color: #343a40; }

    .no-results { color: #6c757d; font-size: .9rem; }

    mark {
      background: rgba(255, 193, 7, 0.28);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }

    #debug-info {
      display: none;
      margin-top: .75rem;
      padding: .6rem .75rem;
      background: #f1f3f5;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      font-size: .75rem;
      font-family: monospace;
      color: #495057;
      line-height: 1.6;
    }
    #debug-info.visible { display: block; }
    .debug-section { margin-bottom: .3rem; }
    .debug-label { color: #868e96; }
    .debug-good { color: #198754; }
    .debug-warn { color: #dc3545; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="/"><img src="/favicon.svg" alt="" width="26" height="26"><span>Theme Ontology</span></a>
      <input type="checkbox" id="nav-toggle" class="nav-toggle">
      <label for="nav-toggle" class="nav-burger" aria-label="Menu">&#9776;</label>
      <nav class="nav-links nav-main">
        <a class="nav-search active" href="/search/">Search</a>
        <a class="nav-stats" href="/stats/">Stats</a>
        <a class="nav-versions" href="/versions/">Versions</a>
        <a href="https://github.com/theme-ontology/theming" target="_blank" rel="noopener">GitHub <span class="ext-mark" aria-hidden="true">&#8599;</span></a>
      </nav>
    </div>
  </header>
  <div id="app">
    <header>
      <h1>Search</h1>
      <div class="search-row">
        <input
          type="search"
          id="query"
          placeholder='Search… (use "phrase" +require -exclude)'
          aria-label="Search query"
          autocomplete="off"
          maxlength="300"
        >
        <button id="search-btn" disabled>Search</button>
      </div>
      <div class="search-options">
        <div class="type-filter">
          <label><input type="radio" name="doc-type" value="all" checked> All</label>
          <label><input type="radio" name="doc-type" value="theme"> Themes</label>
          <label><input type="radio" name="doc-type" value="story"> Stories</label>
          <label><input type="radio" name="doc-type" value="story-theme"> Annotations</label>
        </div>
        <div class="right-options">
          <label class="regex-label" title="Regular-expression search. Smart-case: all-lowercase matches any case; include an uppercase letter to match case exactly."><input type="checkbox" id="regex-mode" disabled> Regex</label>
          <label class="regex-label"><input type="checkbox" id="debug-mode"> Debug</label>
        </div>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">Loading…</div>
      <div id="overall-progress"><div id="overall-fill"></div></div>
      <div id="progress"></div>
      <div id="semantic-loading" class="semantic-loading" role="status" aria-live="polite">
        <span class="semantic-spinner" aria-hidden="true"></span>
        <span id="semantic-loading-text">Loading semantic search…</span>
      </div>
    </header>
    <div id="debug-info"></div>
    <main>
      <div class="results-header">
        <span id="result-count" class="result-count" role="status" aria-live="polite"></span>
        <span id="search-phases" class="search-phases"></span>
      </div>
      <div id="results"></div>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
