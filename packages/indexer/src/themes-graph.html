<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Theme graph · Theme Ontology</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* Ultimate-root colours (society is carved out of "the human world" as a special case). */
  :root {
    --c-alt:#7048e8; --c-human:#e03131; --c-nat:#1971c2; --c-soc:#2f9e44; --shared:#f08c00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #212529; display: flex; flex-direction: column; height: 100vh; }
  header.bar { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; padding: .5rem .9rem; border-bottom: 1px solid #dee2e6; background: #fff; }
  header.bar h1 { font-size: 1rem; font-weight: 700; margin: 0; letter-spacing: -.2px; }
  header.bar a.home { color: #495057; text-decoration: none; font-size: .85rem; }
  header.bar a.home:hover { text-decoration: underline; }
  .spacer { margin-left: auto; }
  .btn { font-size: .78rem; padding: .25rem .6rem; border: 1px solid #ced4da; border-radius: 6px; background: #fff; cursor: pointer; color: #495057; }
  .btn:hover { background: #f1f3f5; }
  .legend { font-size: .72rem; color: #868e96; display: inline-flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: .3rem; }
  .legend .sw { width: 10px; height: 10px; border-radius: 50%; }
  .legend .multi { width: 13px; height: 13px; border-radius: 3px; background: linear-gradient(135deg, var(--c-human) 0 50%, var(--c-nat) 50% 100%); }
  .legend .leafsw { width: 13px; height: 11px; border-radius: 3px; border: 1.4px dashed #adb5bd; background: #f1f3f5; }

  .body { flex: 1; min-height: 0; display: flex; }
  /* Root tree menu */
  nav.tree { width: 230px; flex: none; border-right: 1px solid #dee2e6; background: #fff; overflow: auto; padding: .5rem 0; font-size: .82rem; }
  nav.tree ul { list-style: none; margin: 0; padding: 0; }
  nav.tree li > .row { display: flex; align-items: center; gap: .4rem; padding: .2rem .6rem; cursor: pointer; border-radius: 4px; white-space: nowrap; }
  nav.tree li > .row:hover { filter: brightness(.97); }
  nav.tree .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  nav.tree .grp > .row { font-weight: 600; color: #343a40; }
  nav.tree .ult > .row { font-weight: 700; }   /* ultimate root: tinted row background set inline */
  nav.tree .leaf.active > .row { outline: 2px solid #1971c2; outline-offset: -2px; }
  nav.tree .caret { margin-left: auto; padding-left: .4rem; color: #adb5bd; transition: transform .15s; }
  nav.tree li.collapsed > ul { display: none; }
  nav.tree li.collapsed > .row .caret { transform: rotate(-90deg); }
  nav.tree ul ul { padding-left: .85rem; }

  .stage { position: relative; flex: 1; min-height: 0; }
  #cy { position: absolute; inset: 0; background: #fbfcfd; }
  #hint { position: absolute; left: .8rem; bottom: .6rem; font-size: .72rem; color: #adb5bd; background: rgba(255,255,255,.8); padding: .15rem .4rem; border-radius: 4px; pointer-events: none; }
  #crumbs { position: absolute; left: .8rem; top: .6rem; font-size: .78rem; color: #495057; background: rgba(255,255,255,.85); padding: .2rem .5rem; border-radius: 4px; }
  #panel { position: absolute; top: .6rem; right: .6rem; width: 300px; max-height: calc(100% - 1.2rem); overflow: auto; background: #fff; border: 1px solid #dee2e6; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.08); padding: .8rem .9rem; font-size: .85rem; display: none; }
  #panel.open { display: block; }
  #panel h2 { font-size: .95rem; margin: 0 .9rem 0 0; }
  #panel .ptype { font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; color: #868e96; }
  #panel .close { position: absolute; top: .5rem; right: .55rem; border: 0; background: none; font-size: 1.1rem; line-height: 1; cursor: pointer; color: #adb5bd; }
  #panel .close:hover { color: #495057; }
  #panel section { margin-top: .7rem; }
  #panel .lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; color: #868e96; margin-bottom: .25rem; }
  #panel a { color: #1971c2; text-decoration: none; }
  #panel a:hover { text-decoration: underline; }
  #panel ul { margin: .2rem 0; padding-left: 1.1rem; }
  .chip { display: inline-flex; align-items: center; gap: .35rem; font-size: .75rem; padding: .15rem .5rem; border-radius: 999px; border: 1px solid #e9ecef; background: #f8f9fa; cursor: pointer; margin: .15rem .25rem .15rem 0; }
  .chip .sw { width: 8px; height: 8px; border-radius: 50%; }
  .chip:hover { border-color: #adb5bd; }
  #panel .actions { margin-top: .8rem; display: flex; gap: .4rem; flex-wrap: wrap; }
  #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 2rem; text-align: center; color: #c92a2a; font-size: .9rem; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #868e96; font-size: .9rem; }
</style>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
</head>
<body>
<header class="bar">
  <h1>Theme graph</h1>
  <a class="home" href="../">&larr; stats</a>
  <a class="home" href="../../">site</a>
  <span class="spacer"></span>
  <span class="legend">
    <span><span class="sw" style="background:var(--c-alt)"></span>alternate reality</span>
    <span><span class="sw" style="background:var(--c-human)"></span>the human world</span>
    <span><span class="sw" style="background:var(--c-soc)"></span>society</span>
    <span><span class="sw" style="background:var(--c-nat)"></span>the natural world</span>
    <span><span class="multi"></span>multiple roots</span>
    <span><span class="leafsw"></span>grouped leaves</span>
  </span>
  <button class="btn" id="reset">Reset view</button>
</header>
<div class="body">
  <nav class="tree" id="tree"></nav>
  <div class="stage">
    <div id="cy"></div>
    <div id="loading">Loading theme graph…</div>
    <div id="err"></div>
    <div id="crumbs"></div>
    <div id="hint">Solid nodes = themes, dashed = leaves grouped by shared parents · click to inspect / focus · scroll to zoom · drag to pan</div>
    <aside id="panel"></aside>
  </div>
</div>
<script>
(function () {
  // Nodes shown SPLIT into their children (their children become navigable roots instead of them).
  var SPLIT = ['the human world', 'alternate reality', 'personal human experience', 'society', 'individual humans', 'the natural world'];
  // Ultimate-root colour categories (society carved out of the human world). Base HSL; child
  // roots get a small per-branch hue shift and lighten with depth. Real colours (not CSS vars)
  // because Cytoscape's canvas renderer can't resolve var(--…).
  var CAT_BASE = { 'alternate reality': [262,60,56], 'the human world': [0,68,56], 'the natural world': [209,72,48], 'society': [131,50,42] };
  // Hue spread (degrees relative to the base) across a category's child roots. Some domains
  // veer toward a neighbouring hue for more distinguishable shades: the human world red->orange,
  // society green->yellow-green; alternate reality / the natural world stay symmetric.
  var CAT_HUE = { 'alternate reality': [-40,40], 'the human world': [-6,46], 'the natural world': [-26,26], 'society': [-55,16] };

  var errEl = document.getElementById('err'), loadEl = document.getElementById('loading');
  function fail(msg) { loadEl.style.display = 'none'; errEl.style.display = 'flex'; errEl.textContent = msg; }
  if (!window.cytoscape) { fail('Could not load the graph library (cytoscape).'); return; }
  try { cytoscape.use(window.cytoscapeDagre); } catch (e) {}

  fetch('../themes-graph.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) { build(data.themes || []); })
    .catch(function (e) { fail('Could not load theme data: ' + e.message); });

  function build(themes) {
    if (!themes.length) { fail('No themes in the dataset.'); return; }
    loadEl.style.display = 'none';

    var parentsOf = {}, childrenOf = {}, slugOf = {};
    themes.forEach(function (t) {
      parentsOf[t.name] = t.parents || [];
      slugOf[t.name] = t.slug || '';
      (t.parents || []).forEach(function (p) { (childrenOf[p] = childrenOf[p] || []).push(t.name); });
    });
    var isLeaf = function (n) { return !(childrenOf[n] && childrenOf[n].length); };
    var splitSet = {}; SPLIT.forEach(function (s) { splitSet[s] = true; });

    var descCache = {};
    function descend(root) {
      if (descCache[root]) return descCache[root];
      var seen = {}; seen[root] = true; var q = [root];
      while (q.length) { var n = q.shift(); (childrenOf[n] || []).forEach(function (c) { if (!seen[c]) { seen[c] = true; q.push(c); } }); }
      return (descCache[root] = seen);
    }

    // ── Root tree (top roots, recursively expanding SPLIT nodes) ──────────────────
    var topRoots = themes.filter(function (t) { return !(parentsOf[t.name] || []).length; }).map(function (t) { return t.name; });
    function makeNode(name) {
      var split = !!splitSet[name] && (childrenOf[name] || []).length > 0;
      return { name: name, split: split, children: split ? (childrenOf[name] || []).slice().sort().map(makeNode) : [] };
    }
    var menu = topRoots.slice().sort().map(makeNode);
    var navRoots = [];
    (function collect(nodes) { nodes.forEach(function (n) { if (n.split) collect(n.children); else navRoots.push(n.name); }); })(menu);

    // ── Ultimate-root colour category ─────────────────────────────────────────────
    var societySet = descend('society');
    var catRoots = topRoots; // top-level: alternate reality / the human world / the natural world
    var distCache = {};
    function distFrom(root) {
      if (distCache[root]) return distCache[root];
      var dist = {}; dist[root] = 0; var q = [root];
      while (q.length) { var n = q.shift(); (childrenOf[n] || []).forEach(function (c) { if (dist[c] === undefined) { dist[c] = dist[n] + 1; q.push(c); } }); }
      return (distCache[root] = dist);
    }
    function colorCat(n) {
      if (societySet[n]) return 'society';
      var best = 'the human world', bd = Infinity;
      catRoots.forEach(function (r) { var d = distFrom(r)[n]; if (d !== undefined && d < bd) { bd = d; best = r; } });
      return best;
    }
    // Ultimate domains a node spans (society counts as its own domain). >1 => "multi": its fill
    // is split between the domain base colours (diagonal hard-stop gradient).
    var DOMAIN_ORDER = ['alternate reality', 'the human world', 'the natural world', 'society'];
    function domainsOf(n) {
      return DOMAIN_ORDER.filter(function (r) {
        if (r === 'society') return !!societySet[n];
        if (r === 'the human world') return !!descend(r)[n] && !societySet[n];
        return !!descend(r)[n];
      });
    }
    function catBaseColor(cat) { var b = CAT_BASE[cat] || [0, 0, 60]; return 'hsl(' + b[0] + ',' + b[1] + '%,' + b[2] + '%)'; }
    // Per-category-root BFS recording each node's depth and which immediate child ("branch") of
    // the category root it descends from — used to vary hue per branch and lighten by depth.
    var branchCache = {};
    function branchInfo(root) {
      if (branchCache[root]) return branchCache[root];
      var info = {}; info[root] = { depth: 0, branch: null };
      (childrenOf[root] || []).forEach(function (c) { if (!info[c]) info[c] = { depth: 1, branch: c }; });
      var q = (childrenOf[root] || []).slice();
      while (q.length) { var n = q.shift(); (childrenOf[n] || []).forEach(function (c) { if (!info[c]) { info[c] = { depth: info[n].depth + 1, branch: info[n].branch }; q.push(c); } }); }
      return (branchCache[root] = info);
    }
    function colorForNode(n) {
      var cat = colorCat(n);                       // category root is a real node name
      var base = CAT_BASE[cat] || [0, 0, 60];
      var info = branchInfo(cat)[n] || { depth: 0, branch: null };
      var sibs = (childrenOf[cat] || []).slice().sort();
      var i = info.branch ? sibs.indexOf(info.branch) : -1;
      // Map each child root across the category's hue range; deeper nodes within a branch
      // lighten. The category root itself (no branch) keeps the base hue.
      var rng = CAT_HUE[cat] || [-40, 40];
      var t = (sibs.length > 1 && i >= 0) ? i / (sibs.length - 1) : 0.5;
      var hueOff = (i >= 0) ? (rng[0] + (rng[1] - rng[0]) * t) : 0;
      var light = Math.min(base[2] + Math.min(info.depth, 6) * 4, base[2] + 24);
      var h = (Math.round(base[0] + hueOff) % 360 + 360) % 360;
      return 'hsl(' + h + ',' + base[1] + '%,' + light + '%)';
    }

    // ── Leaf bundling ──────────────────────────────────────────────────────────────
    // Leaves sharing the exact same parent-set collapse into one "bundle" node wired to those
    // parents, so a multi-parent leaf appears once (not duplicated). Internal nodes stay single.
    var bundles = {};
    themes.forEach(function (t) {
      if (!isLeaf(t.name)) return;
      var ps = (parentsOf[t.name] || []).slice().sort();
      var k = ps.join('');
      if (!bundles[k]) bundles[k] = { id: 'b:' + k, parents: ps, leaves: [] };
      bundles[k].leaves.push(t.name);
    });
    var bundleList = [], bundleById = {};
    Object.keys(bundles).forEach(function (k) { bundleList.push(bundles[k]); bundleById[bundles[k].id] = bundles[k]; });

    // Diagonal hard-stop gradient data for a node spanning >1 ultimate domain (else null).
    function gradData(n) {
      var doms = domainsOf(n);
      if (doms.length < 2) return null;
      var cols = doms.map(catBaseColor), gc = [], gp = [], m = cols.length;
      for (var x = 0; x < m; x++) { gc.push(cols[x], cols[x]); gp.push(Math.round(x / m * 100) + '%', Math.round((x + 1) / m * 100) + '%'); }
      return { grad: gc.join(' '), gradPos: gp.join(' ') };
    }

    // ── Tree menu UI ──────────────────────────────────────────────────────────────
    var treeEl = document.getElementById('tree');
    var leafEls = {};
    function isUltimate(n) { return topRoots.indexOf(n) >= 0 || n === 'society'; }
    function ultTint(n) { var b = CAT_BASE[colorCat(n)] || [0, 0, 92]; return 'hsl(' + b[0] + ',' + Math.round(b[1] * 0.65) + '%,93%)'; }
    function renderMenu(nodes, ul, depth) {
      nodes.forEach(function (node) {
        var li = document.createElement('li');
        var row = document.createElement('div'); row.className = 'row';
        var sw = '<span class="sw" style="background:' + colorForNode(node.name) + '"></span>';
        if (isUltimate(node.name)) {
          li.classList.add('ult'); row.style.background = ultTint(node.name);
          // Bleed the tint past the nesting indent to the panel's left edge (text stays put).
          if (depth > 0) { row.style.marginLeft = (-(depth * 0.85)) + 'rem'; row.style.paddingLeft = (0.6 + depth * 0.85) + 'rem'; }
        }
        if (node.split) {
          li.classList.add('grp');
          row.innerHTML = sw + escapeHtml(node.name) + '<span class="caret">&#9662;</span>';
          row.addEventListener('click', function () { li.classList.toggle('collapsed'); });
          li.appendChild(row);
          var sub = document.createElement('ul'); renderMenu(node.children, sub, depth + 1); li.appendChild(sub);
        } else {
          li.classList.add('leaf'); leafEls[node.name] = li;
          row.innerHTML = sw + escapeHtml(node.name);
          row.addEventListener('click', function () { selectRoot(node.name); });
          li.appendChild(row);
        }
        ul.appendChild(li);
      });
    }
    var rootUl = document.createElement('ul'); renderMenu(menu, rootUl, 0); treeEl.appendChild(rootUl);

    // ── Cytoscape ───────────────────────────────────────────────────────────────
    var cy = cytoscape({
      container: document.getElementById('cy'), wheelSensitivity: 0.2,
      style: [
        { selector: 'node', style: {
          'background-color': 'data(color)', 'background-opacity': 0.5,
          'border-width': 1.2, 'border-color': 'data(color)', 'border-opacity': 0.8,
          'label': 'data(label)', 'color': '#212529',
          'font-size': 11, 'text-valign': 'center', 'text-halign': 'center', 'text-wrap': 'wrap',
          'text-max-width': 130, 'width': 'label', 'height': 'label', 'padding': '7px',
          'shape': 'round-rectangle', 'min-zoomed-font-size': 7 } },
        // Multi-domain node: fill split between its domains' base colours along the diagonal.
        { selector: 'node.multi', style: {
          'background-fill': 'linear-gradient', 'background-gradient-direction': 'to-bottom-right',
          'background-gradient-stop-colors': 'data(grad)', 'background-gradient-stop-positions': 'data(gradPos)' } },
        // Leaf-bundle node (one or more leaves sharing a parent-set): dashed, lighter.
        { selector: 'node.bundle', style: {
          'border-style': 'dashed', 'border-opacity': 0.9, 'background-opacity': 0.32, 'font-size': 10, 'color': '#495057' } },
        { selector: 'edge', style: {
          'width': 1.4, 'line-color': '#ced4da', 'target-arrow-color': '#ced4da',
          'target-arrow-shape': 'triangle-backcurve', 'arrow-scale': .9, 'curve-style': 'bezier',
          'line-cap': 'round', 'target-distance-from-node': 2, 'source-endpoint': 'outside-to-node' } },
        { selector: '.faded', style: { 'opacity': 0.12 } },
        { selector: '.hi', style: { 'border-width': 3, 'border-color': '#343a40', 'z-index': 99 } },
        { selector: 'edge.hi', style: { 'line-color': '#868e96', 'target-arrow-color': '#868e96', 'width': 2.2, 'opacity': 1 } }
      ]
    });

    function elementsFor(root) {
      var reach = descend(root);
      var internal = Object.keys(reach).filter(function (n) { return !isLeaf(n); });
      var inGraph = {}; internal.forEach(function (n) { inGraph[n] = true; });
      var els = [];
      // Internal nodes — one per theme.
      internal.forEach(function (n) {
        var d = { id: n, label: n, color: colorForNode(n) };
        var g = gradData(n); if (g) { d.grad = g.grad; d.gradPos = g.gradPos; }
        els.push({ data: d, classes: g ? 'multi' : '' });
      });
      internal.forEach(function (n) {
        (parentsOf[n] || []).forEach(function (p) { if (inGraph[p]) els.push({ data: { id: p + '→' + n, source: p, target: n } }); });
      });
      // Leaf bundles whose parent-set touches this subgraph.
      bundleList.forEach(function (b) {
        var ph = b.parents.filter(function (p) { return inGraph[p]; });
        if (!ph.length) return;
        var rep = b.leaves.slice().sort()[0];
        var label = rep + (b.leaves.length > 1 ? '  +' + (b.leaves.length - 1) : '');
        var d = { id: b.id, label: label, color: colorForNode(rep) };
        var g = gradData(rep); if (g) { d.grad = g.grad; d.gradPos = g.gradPos; }
        els.push({ data: d, classes: 'bundle' + (g ? ' multi' : '') });
        ph.forEach(function (p) { els.push({ data: { id: p + '→' + b.id, source: p, target: b.id } }); });
      });
      return els;
    }

    function layout() {
      var opts = window.cytoscapeDagre
        ? { name: 'dagre', rankDir: 'LR', nodeSep: 18, rankSep: 70, edgeSep: 8, animate: true, animationDuration: 350, fit: true, padding: 30 }
        : { name: 'breadthfirst', directed: true, spacingFactor: 1.2, animate: true, fit: true, padding: 30 };
      cy.layout(opts).run();
    }

    var active = null;
    function selectRoot(root) {
      active = root; focused = null;
      Object.keys(leafEls).forEach(function (n) { leafEls[n].classList.toggle('active', n === root); });
      document.getElementById('crumbs').textContent = root;
      cy.elements().remove();
      cy.add(elementsFor(root));
      layout();
      closePanel();
    }

    // ── Interaction ───────────────────────────────────────────────────────────────
    var focused = null;
    function clearHi() { cy.elements().removeClass('hi faded'); }
    function highlightNeighborhood(node) { cy.elements().addClass('faded'); node.closedNeighborhood().removeClass('faded').addClass('hi'); }
    cy.on('mouseover', 'node', function (e) { if (!focused) highlightNeighborhood(e.target); });
    cy.on('mouseout', 'node', function () { if (!focused) clearHi(); });
    cy.on('tap', 'node', function (e) { openPanel(e.target); });
    cy.on('tap', function (e) { if (e.target === cy) { closePanel(); if (!focused) clearHi(); } });

    function focusSubtree(name) {
      var node = cy.getElementById(name); if (!node.length) return;
      focused = name;
      var keep = node.union(node.successors()); // descendants incl. their leaf bundles
      cy.batch(function () { cy.elements().style('display', 'none'); keep.style('display', 'element'); });
      clearHi(); layout();
    }
    function unfocus() { focused = null; cy.batch(function () { cy.elements().forEach(function (el) { el.style('display', 'element'); }); }); layout(); }
    document.getElementById('reset').addEventListener('click', function () { unfocus(); closePanel(); cy.fit(undefined, 40); });

    // ── Side panel ──────────────────────────────────────────────────────────────
    var panel = document.getElementById('panel');
    function closePanel() { panel.classList.remove('open'); }
    function themeHref(name) { var s = slugOf[name]; return s ? '../../theme/' + s + '.html' : null; }
    function nameLink(name) { var h = themeHref(name); return h ? '<a href="' + h + '">' + escapeHtml(name) + '</a>' : escapeHtml(name); }

    function openPanel(node) {
      if (bundleById[node.id()]) { openBundlePanel(node); return; }
      var name = node.id();
      var kids = (childrenOf[name] || []).filter(function (c) { return !isLeaf(c); }).sort();
      var leaves = (childrenOf[name] || []).filter(isLeaf).length;
      var pars = (parentsOf[name] || []).slice().sort();
      var inRoots = navRoots.filter(function (r) { return r !== active && descend(r)[name]; });

      var html = '<button class="close" aria-label="Close">&times;</button>';
      html += '<div class="ptype">theme · ' + escapeHtml(colorCat(name)) + '</div><h2>' + nameLink(name) + '</h2>';
      if (inRoots.length) {
        html += '<section><div class="lbl">Also under</div>';
        inRoots.forEach(function (r) { html += '<span class="chip" data-jump="' + escapeAttr(r) + '"><span class="sw" style="background:' + colorForNode(r) + '"></span>' + escapeHtml(r) + '</span>'; });
        html += '</section>';
      }
      if (pars.length) html += '<section><div class="lbl">Parents</div><div>' + pars.map(nameLink).join(' · ') + '</div></section>';
      if (kids.length) html += '<section><div class="lbl">Sub-themes (' + kids.length + ')</div><div>' + kids.map(nameLink).join(' · ') + '</div></section>';
      if (leaves) html += '<section><div class="lbl">Leaf themes</div><div>' + leaves + ' directly under this theme (shown as dashed nodes)</div></section>';
      html += '<div class="actions">';
      if (kids.length || leaves) html += '<button class="btn" data-focus="1">Focus subtree</button>';
      var hh = themeHref(name); if (hh) html += '<a class="btn" href="' + hh + '">Open page &rarr;</a>';
      html += '</div>';
      panel.innerHTML = html; panel.classList.add('open');
      panel.querySelector('.close').addEventListener('click', closePanel);
      var fb = panel.querySelector('[data-focus]'); if (fb) fb.addEventListener('click', function () { focusSubtree(name); });
      Array.prototype.forEach.call(panel.querySelectorAll('[data-jump]'), function (chip) { chip.addEventListener('click', function () { jumpTo(chip.dataset.jump, name); }); });
      clearHi(); highlightNeighborhood(node); cy.animate({ center: { eles: node }, duration: 250 });
    }

    function openBundlePanel(node) {
      var b = bundleById[node.id()];
      var single = b.leaves.length === 1;
      var rep = b.leaves.slice().sort()[0];
      var pars = b.parents.slice().sort();
      var html = '<button class="close" aria-label="Close">&times;</button>';
      html += '<div class="ptype">' + (single ? 'leaf theme' : b.leaves.length + ' leaf themes · shared parents') + '</div>';
      html += '<h2>' + nameLink(rep) + (single ? '' : ' <span style="color:#868e96;font-weight:400">+' + (b.leaves.length - 1) + ' more</span>') + '</h2>';
      if (pars.length) html += '<section><div class="lbl">Parent' + (pars.length > 1 ? 's' : '') + '</div><div>' + pars.map(nameLink).join(' · ') + '</div></section>';
      if (!single) {
        html += '<section><div class="lbl">Themes (' + b.leaves.length + ')</div><ul>';
        b.leaves.slice().sort().forEach(function (l) { html += '<li>' + nameLink(l) + '</li>'; });
        html += '</ul></section>';
      } else { var hh = themeHref(b.leaves[0]); if (hh) html += '<div class="actions"><a class="btn" href="' + hh + '">Open page &rarr;</a></div>'; }
      panel.innerHTML = html; panel.classList.add('open');
      panel.querySelector('.close').addEventListener('click', closePanel);
      clearHi(); highlightNeighborhood(node); cy.animate({ center: { eles: node }, duration: 250 });
    }
    function jumpTo(root, name) {
      selectRoot(root);
      var nd = cy.getElementById(name);
      if (nd.length) { cy.animate({ center: { eles: nd }, zoom: Math.max(cy.zoom(), 1), duration: 300 }); openPanel(nd); }
    }

    function escapeHtml(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function escapeAttr(s) { return escapeHtml(s).replace(/'/g, '&#39;'); }

    selectRoot(navRoots[0]);
  }
})();
</script>
</body>
</html>
