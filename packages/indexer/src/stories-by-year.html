<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stories by year · Theme Ontology</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bar-film:#474e8a; --bar-other:#7eb1dd; --yw:3.4rem;
          /* Grey panel banding (white gridlines show against it); header a step darker. */
          --band-a:#e6eaee; --band-b:#eef1f4; --hdr:#dce1e6; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #212529; display: flex; flex-direction: column; height: 100vh; }
  header.bar { flex: none; display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; padding: .5rem .9rem; border-bottom: 1px solid #dee2e6; background: #fff; }
  header.bar h1 { font-size: 1rem; font-weight: 700; margin: 0; line-height: 1.4; letter-spacing: -.2px; }
  header.bar a.home { color: #495057; text-decoration: none; font-size: .85rem; }
  header.bar a.home:hover { text-decoration: underline; }
  main { flex: 1; min-height: 0; overflow: hidden; width: 100%; max-width: 1180px; margin: 0 auto; padding: 1.2rem 1rem 1rem; display: flex; flex-direction: column; }
  .intro { font-size: .85rem; color: #495057; margin: 0 0 .35rem; }
  .legend { display: flex; gap: 1.1rem; font-size: .78rem; color: #495057; margin: 0 0 .8rem; }
  .legend span { display: inline-flex; align-items: center; gap: .35rem; }
  .legend i.sw { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
  .legend i.film { background: var(--bar-film); }
  .legend i.other { background: var(--bar-other); }

  /* Region heading strip above the plot, offset by the y-axis gutter and scrolled in
     sync with the bars. Two lines (year range + binning mode), white with black rules. */
  .zonebar { flex: none; height: 2.6rem; margin-left: calc(var(--yw) + 1px); overflow: hidden; }
  .zstrip { position: relative; height: 100%; }
  .zlabel { position: absolute; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .05rem; text-align: center; line-height: 1.15; overflow: hidden; background: #fff; border-bottom: 1px solid #212529; }
  .zlabel .r { font-size: .7rem; font-weight: 600; color: #212529; white-space: nowrap; }
  .zlabel .m { font-size: .66rem; color: #868e96; white-space: nowrap; }
  .zlabel + .zlabel { border-left: 1px solid #212529; }

  /* Chart: y-axis gutter + a horizontally scrollable plot of equal-gap bars. */
  .chart { flex: 1; min-height: 0; display: flex; }
  .yaxis { flex: none; width: var(--yw); position: relative; }
  .yaxis .tick { position: absolute; right: 0; transform: translateY(-50%); display: flex; align-items: center; justify-content: flex-end; }
  .yaxis .tick i { display: block; border-top: 1px solid #adb5bd; }
  .yaxis .tick.major i { width: 7px; }
  .yaxis .tick.minor i { width: 4px; border-top-color: #ced4da; }
  .yaxis .tick b { margin-right: 5px; font-size: .68rem; font-weight: 400; color: #868e96; font-variant-numeric: tabular-nums; }
  .yaxis .tick.max b { font-weight: 700; color: #495057; }
  .plot { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; position: relative; border-left: 1px solid #dee2e6; border-bottom: 1px solid #dee2e6; }
  /* width:max-content makes .bars as wide as its bars (not just the viewport), so the
     gridlines (left:0/right:0) span the full scroll width rather than stopping at the edge. */
  .bars { position: relative; height: 100%; display: flex; align-items: flex-end; gap: 1px; padding: 0 .3rem; width: max-content; min-width: 100%; }
  /* White horizontal gridlines, inside .bars so they span the full scroll width. Above the
     shading, below the bars. */
  .gline { position: absolute; left: 0; right: 0; border-top: 1px solid #ffffff; z-index: 1; pointer-events: none; }
  .gline.top { border-top-color: #cdd3d9; }
  /* Gray dotted dividers at every millennium boundary. Scroll with the bars. */
  .mill-line { position: absolute; top: 0; bottom: 0; border-left: 1px dotted #adb5bd; z-index: 1; pointer-events: none; }
  /* Region/decade shading, scrolls with the bars (placed inside .bars), behind them. */
  .zone-shade { position: absolute; top: 0; bottom: 0; z-index: 0; }
  .zone-shade.z-a { background: var(--band-a); }
  .zone-shade.z-b { background: var(--band-b); }
  /* Short ticks at decade boundaries within the by-year region (x-axis baseline). */
  .decade-tick { position: absolute; bottom: 0; height: 7px; border-left: 1px solid #aeb6bf; z-index: 1; }
  /* Bins coarsen going back in time, so wider categories get wider columns. Bars are
     stacked: films (movie:) at the base + everything else on top, in two colours. */
  .bin { flex: 0 0 9px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; position: relative; z-index: 2; }
  .bin.decade { flex-basis: 22px; }
  .bin.century { flex-basis: 26px; }
  .bin.mill { flex-basis: 66px; }
  .bin .bar { width: 100%; display: flex; flex-direction: column; border-radius: 2px 2px 0 0; overflow: hidden; min-height: 0; }
  .bin { cursor: pointer; }
  .bin .seg.other { background: var(--bar-other); }
  .bin .seg.film { background: var(--bar-film); }
  /* Thin white separator between stacked segments (only when both are present). */
  .bin .seg.other + .seg.film { border-top: 1px solid #fff; }
  .bin:hover .bar { filter: brightness(.92); }

  /* X-axis tick labels, horizontal (never angled), mirroring the bar widths so each label
     centres under its bar; overlapping labels are dropped client-side. */
  .xaxis { flex: none; height: 1.3rem; margin-left: calc(var(--yw) + 1px); overflow: hidden; }
  .xstrip { display: flex; gap: 1px; padding: .25rem .3rem 0; min-width: 100%; }
  .xlab { flex: 0 0 9px; font-size: .65rem; color: #868e96; white-space: nowrap; overflow: visible; position: relative; }
  .xlab.decade { flex-basis: 22px; }
  .xlab.century { flex-basis: 26px; }
  .xlab.mill { flex-basis: 66px; }
  .xlab span { position: absolute; left: 50%; top: 0; transform: translateX(-50%); }

  /* Click/tap popup: a header + a scrollable, linked list of the bin's stories. */
  #pop { position: fixed; z-index: 20; display: none; flex-direction: column; width: 264px; max-width: 92vw; max-height: 62vh; background: #fff; border: 1px solid #ced4da; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.18); overflow: hidden; }
  #pop .pop-head { flex: none; padding: .5rem .7rem; border-bottom: 1px solid #eef0f2; font-size: .8rem; font-weight: 600; color: #212529; display: flex; align-items: baseline; gap: .4rem; }
  #pop .pop-head .sub { font-weight: 400; color: #868e96; font-size: .72rem; }
  #pop .pop-head button { margin-left: auto; align-self: flex-start; border: 0; background: none; font-size: 1.15rem; line-height: 1; color: #adb5bd; cursor: pointer; padding: 0 .1rem; }
  #pop .pop-head button:hover { color: #495057; }
  #pop ul { list-style: none; margin: 0; padding: .25rem 0; overflow-y: auto; }
  #pop li { display: flex; align-items: center; gap: .45rem; padding: .16rem .7rem; font-size: .8rem; }
  #pop li .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  #pop li .dot.film { background: var(--bar-film); }
  #pop li .dot.other { background: var(--bar-other); }
  #pop li a, #pop li span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pop li a { color: #1f6feb; text-decoration: none; }
  #pop li a:hover { text-decoration: underline; }
  #pop li .yr { margin-left: auto; padding-left: .5rem; color: #adb5bd; font-variant-numeric: tabular-nums; flex: none; }
  #err { padding: 2rem; color: #c92a2a; }
</style>
</head>
<body>
<header class="bar">
  <h1>Stories by year</h1>
  <a class="home" href="../">&larr; stats</a>
  <a class="home" href="../../">site</a>
</header>
<main>
  <p class="intro" id="intro">Loading…</p>
  <div class="legend" id="legend" style="display:none">
    <span><i class="sw film"></i>films</span>
    <span><i class="sw other"></i>other</span>
  </div>
  <div id="err" style="display:none"></div>
  <div class="zonebar" id="zonebar" style="display:none"><div class="zstrip" id="zstrip"></div></div>
  <div class="chart" id="chart" style="display:none">
    <div class="yaxis" id="yaxis"></div>
    <div class="plot" id="plot">
      <div class="bars" id="bars"></div>
    </div>
  </div>
  <div class="xaxis" id="xaxis" style="display:none"><div class="xstrip" id="xstrip"></div></div>
</main>
<div id="pop">
  <div class="pop-head"><span id="pop-title"></span><button id="pop-close" aria-label="Close">&times;</button></div>
  <ul id="pop-list"></ul>
</div>
<script>
(function () {
  var introEl = document.getElementById('intro'), errEl = document.getElementById('err');
  function fail(m) { introEl.style.display = 'none'; errEl.style.display = 'block'; errEl.textContent = m; }

  fetch('../stories-by-year.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) { init(data); })
    .catch(function (e) { fail('Could not load data: ' + e.message); });

  // A "nice" major-tick step (1/2/5 × 10^k) for a given range.
  function niceStep(max) {
    var pow = Math.pow(10, Math.floor(Math.log10(max)));
    var n = max / pow;
    return Math.max(1, (n < 2 ? 0.2 : n < 5 ? 0.5 : 1) * pow);
  }

  function init(data) {
    var bins = data.bins || [];
    // Exact top: the tallest bar reaches 100%.
    var max = bins.reduce(function (m, b) { return Math.max(m, b.count); }, 0) || 1;

    introEl.textContent = data.total.toLocaleString()
      + ' stories by earliest known publication date — per year from 1950,'
      + ' per decade for 1900–1949, per century before.';
    document.getElementById('legend').style.display = '';
    document.getElementById('zonebar').style.display = '';
    document.getElementById('chart').style.display = '';
    document.getElementById('xaxis').style.display = '';

    // ── Y axis: major (labelled) + minor (short) ticks, exact max written at the top. ──
    var step = niceStep(max);
    var lead = step / Math.pow(10, Math.floor(Math.log10(step)));   // 1, 2 or 5
    var minor = step / (Math.round(lead) === 2 ? 4 : 5);            // keeps minors round
    var yax = document.getElementById('yaxis');
    var yh = '', gh = '';   // gh (gridlines) is inserted into .bars below so it spans the scroll width
    var pctOf = function (v) { return 100 - (v / max) * 100; };
    if (minor >= 1) {
      for (var v = minor; v < max - 1e-6; v += minor) {
        if (Math.abs(v / step - Math.round(v / step)) < 1e-6) continue; // skip majors
        yh += '<span class="tick minor" style="top:' + pctOf(v) + '%"><i></i></span>';
      }
    }
    for (var k = 0; k * step <= max + 1e-6; k++) {
      var mv = k * step;
      if (mv > 0 && max - mv < step * 0.5) continue; // too close to the max label
      yh += '<span class="tick major" style="top:' + pctOf(mv) + '%"><b>' + Math.round(mv) + '</b><i></i></span>';
      gh += '<div class="gline" style="top:' + pctOf(mv) + '%"></div>';
    }
    // The max, always written, exactly at the top.
    yh += '<span class="tick major max" style="top:0"><b>' + Math.round(max) + '</b><i></i></span>';
    gh += '<div class="gline top" style="top:0"></div>';
    yax.innerHTML = yh;

    // ── Bars + x-axis labels ──
    // Inverted: newest first, so modern times are visible at load (scrollLeft 0) with the
    // axis running back in time to the right.
    var view = bins.slice().reverse();
    var barsEl = document.getElementById('bars'), xstrip = document.getElementById('xstrip');
    var bh = '', xh = '';
    view.forEach(function (b, i) {
      var hpct = (b.count / max) * 100;
      var other = b.count - (b.film || 0);
      var cls = b.era === 'century' ? (b.bc ? ' century bc' : (b.mill ? ' century mill' : ' century')) : (b.era === 'decade' ? ' decade' : ' year');
      // Stacked: films at the base, everything else above. flex-grow splits by count.
      // Zero-count segments are omitted so single-format bars carry no separator.
      var segs = '';
      if (other > 0) segs += '<div class="seg other" style="flex:' + other + '"></div>';
      if (b.film) segs += '<div class="seg film" style="flex:' + b.film + '"></div>';
      bh += '<div class="bin' + cls + '" data-i="' + i + '"><div class="bar" style="height:' + hpct + '%">' + segs + '</div></div>';
      var lab = '';
      if (b.mill) lab = ''; // labelled on its own background instead
      else if (b.era === 'century' || b.era === 'decade') lab = b.label;
      else if (+b.label % 10 === 0) lab = b.label; // decade marks on the yearly axis
      xh += '<div class="xlab' + cls + '">' + (lab ? '<span>' + lab + '</span>' : '') + '</div>';
    });
    barsEl.innerHTML = bh; xstrip.innerHTML = xh;

    // Drop any x-label whose box would overlap the previous kept one (left to right).
    var spans = xstrip.querySelectorAll('.xlab > span');
    var lastRight = -Infinity;
    for (var s = 0; s < spans.length; s++) {
      var rc = spans[s].getBoundingClientRect();
      if (rc.left < lastRight + 5) spans[s].style.visibility = 'hidden';
      else lastRight = rc.right;
    }

    // ── Region annotations (header) + plot shading, measured from the laid-out bars. ──
    var total = barsEl.scrollWidth;
    var binEls = barsEl.querySelectorAll('.bin'); // in view order

    // Header: one two-line label (year range + binning mode) per region, ordered by screen
    // position. The by-year span is broken at the millennium (2000–present / 1950–1999) and
    // the 1st-millennium bucket is its own region. Ranges + edges come from the bins.
    var regionDefs = [
      { key: 'y2', mode: 'by year', test: function (b) { return b.era === 'year' && b.lo >= 2000; } },
      { key: 'y1', mode: 'by year', test: function (b) { return b.era === 'year' && b.lo < 2000; } },
      { key: 'dec', mode: 'by decade', test: function (b) { return b.era === 'decade'; } },
      { key: 'cen', mode: 'by century', test: function (b) { return b.era === 'century' && !b.bc && !b.mill; } },
      { key: 'mil', mode: 'by millennium', test: function (b) { return b.mill; } },
      { key: 'bce', mode: 'by century', test: function (b) { return b.era === 'century' && b.bc; } },
    ];
    var present = [];
    regionDefs.forEach(function (rd) {
      var lo = Infinity, hi = -Infinity, left = Infinity, found = false;
      view.forEach(function (b, i) {
        if (!rd.test(b)) return;
        found = true;
        if (b.lo < lo) lo = b.lo;
        if (b.hi > hi) hi = b.hi;
        var x = binEls[i].offsetLeft; if (x < left) left = x;
      });
      if (!found) return;
      var range = rd.key === 'y2' ? lo + '–present'
        : rd.key === 'bce' ? Math.abs(lo) + '–' + Math.abs(hi) + ' BCE'
          : rd.key === 'mil' ? lo + '–' + hi + ' CE'
            : lo + '–' + hi;
      present.push({ mode: rd.mode, range: range, left: left });
    });
    present.sort(function (a, b) { return a.left - b.left; });
    var zoneHtml = '';
    present.forEach(function (p, i) {
      var L = i === 0 ? 0 : p.left;
      var R = i === present.length - 1 ? total : present[i + 1].left;
      zoneHtml += '<div class="zlabel" style="left:' + L + 'px;width:' + (R - L) + 'px">'
        + '<span class="r">' + p.range + '</span><span class="m">' + p.mode + '</span></div>';
    });

    // Plot shading: alternating grey cells — one per decade inside the by-year region,
    // one per whole region elsewhere — and short ticks at the by-year decade boundaries.
    var cellKey = function (b) {
      return b.era === 'year' ? 'y' + Math.floor(+b.label / 10)
        : b.era === 'decade' ? 'd' : (b.bc ? 'cb' : 'cc');
    };
    var cells = [];
    view.forEach(function (b, i) {
      var k = cellKey(b), last = cells[cells.length - 1];
      if (last && last.key === k) last.end = i;
      else cells.push({ key: k, start: i, end: i, year: b.era === 'year' });
    });
    var shadeHtml = '', tickHtml = '';
    cells.forEach(function (c, i) {
      var L = i === 0 ? 0 : binEls[c.start].offsetLeft;
      var R = i === cells.length - 1 ? total : binEls[cells[i + 1].start].offsetLeft;
      shadeHtml += '<div class="zone-shade ' + (i % 2 ? 'z-b' : 'z-a') + '" style="left:' + L + 'px;width:' + (R - L) + 'px"></div>';
      if (c.year && i > 0 && cells[i - 1].year) {
        tickHtml += '<div class="decade-tick" style="left:' + (binEls[c.start].offsetLeft - 1) + 'px"></div>';
      }
    });
    // Gray dotted dividers at every millennium boundary (where the 1000-year block changes:
    // year 0, 1000, 2000, …; the 1st-millennium bucket is years 1–1000).
    var mblock = function (b) {
      if (b.bc) return -1;
      if (b.mill) return 0;
      if (b.era === 'year') return Math.floor(+b.label / 1000); // 2000 starts a new block
      return 1; // CE centuries + decades sit in the 2nd millennium
    };
    var millHtml = '';
    for (var mi = 1; mi < view.length; mi++) {
      if (mblock(view[mi]) !== mblock(view[mi - 1])) {
        millHtml += '<div class="mill-line" style="left:' + (binEls[mi].offsetLeft - 1) + 'px"></div>';
      }
    }
    barsEl.insertAdjacentHTML('afterbegin', gh + shadeHtml + tickHtml + millHtml);
    var zstrip = document.getElementById('zstrip');
    zstrip.style.width = total + 'px';
    zstrip.innerHTML = zoneHtml;

    // ── Popup + scroll dismissal ──
    var pop = document.getElementById('pop'), popTitle = document.getElementById('pop-title'), popList = document.getElementById('pop-list');
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function hidePop() { pop.style.display = 'none'; }
    function ymd(y) { return y < 0 ? (-y) + ' BCE' : '' + y; }

    // Click/tap a bar → list its stories (linked to their pages); content adapts to bar type.
    function openPop(bin) {
      var b = view[+bin.getAttribute('data-i')];
      if (!b || !b.count) return;
      var films = b.film ? b.film.toLocaleString() + ' film' + (b.film === 1 ? '' : 's') : '';
      var sub = b.count.toLocaleString() + ' stor' + (b.count === 1 ? 'y' : 'ies') + (films ? ' · ' + films : '');
      popTitle.innerHTML = esc(b.tip || b.label) + ' <span class="sub">' + sub + '</span>';
      var showYr = b.era !== 'year'; // a single year is redundant per row
      var html = '';
      (b.items || []).forEach(function (it) {
        var name = esc(it.t);
        var label = it.s ? '<a href="../../story/' + it.s + '.html">' + name + '</a>' : '<span class="t">' + name + '</span>';
        html += '<li><span class="dot ' + (it.f ? 'film' : 'other') + '"></span>' + label
          + (showYr ? '<span class="yr">' + ymd(it.y) + '</span>' : '') + '</li>';
      });
      popList.innerHTML = html;
      popList.scrollTop = 0;
      pop.style.display = 'flex';
      var r = bin.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
      var left = Math.max(8, Math.min(r.left + r.width / 2 - pw / 2, window.innerWidth - pw - 8));
      var top = r.top - ph - 8;
      if (top < 8) top = Math.min(r.bottom + 8, window.innerHeight - ph - 8);
      pop.style.left = left + 'px';
      pop.style.top = Math.max(8, top) + 'px';
    }

    barsEl.addEventListener('click', function (e) {
      var bin = e.target.closest ? e.target.closest('.bin') : null;
      if (!bin) return;
      e.stopPropagation();
      openPop(bin);
    });
    pop.addEventListener('click', function (e) { e.stopPropagation(); }); // links still navigate
    document.getElementById('pop-close').addEventListener('click', hidePop);
    document.addEventListener('click', hidePop);          // background tap
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hidePop(); });
    window.addEventListener('resize', hidePop);
    window.addEventListener('scroll', hidePop, { passive: true });
    window.addEventListener('touchmove', function (e) {   // chart/page scroll, not popup-internal
      if (!(e.target.closest && e.target.closest('#pop'))) hidePop();
    }, { passive: true });

    // ── Scroll sync (drives the strips) + dismiss the popup on chart scroll. ──
    var plot = document.getElementById('plot'), xa = document.getElementById('xaxis'), zb = document.getElementById('zonebar');
    plot.addEventListener('scroll', function () { xa.scrollLeft = plot.scrollLeft; zb.scrollLeft = plot.scrollLeft; hidePop(); });
  }
})();
</script>
</body>
</html>
