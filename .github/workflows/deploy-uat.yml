name: Deploy UAT to S3/CloudFront

# Builds the production site and publishes it to the UAT bucket behind
# uat.themeontology.org. Auth is GitHub OIDC (no stored AWS keys); trust is restricted
# to this repo's default branch.
#
# Site layout (served at the bucket root, version-less):
#   /                front page (intro + stats)
#   /search/         search SPA (built at base /search/)
#   /theme/, /story/ detail pages
#   /versions/       version listing (links rendered from /versions.json)
#   /latest.json, /minisearch.json, /*.bin   index artifacts
#   /robots.txt      keeps crawlers out of /main/ and /versions/
# Retention: each run also snapshots to /<branch>/<month>/ for rollback.
# Shared (not per-version): /models/  (Hugging Face files).
#
# Requires repo Variables: AWS_DEPLOY_ROLE_ARN, AWS_REGION, S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-uat
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute deploy path
        id: vars
        run: |
          MONTH="$(date -u +%Y-%m)"
          echo "branch=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          echo "prefix=$GITHUB_REF_NAME/$MONTH" >> "$GITHUB_OUTPUT"
          # Built at base /search/; data + models referenced at the shared root.
          {
            echo "APP_BASE=/search/"
            echo "VITE_LATEST_JSON_URL=/latest.json"
            echo "VITE_MODELS_URL=/models/"
          } >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install totolo
        run: pip install totolo

      - name: Generate corpus
        run: python -m totolo.util.makejson -tsc > corpus.json

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Cache HuggingFace models (build-time embeddings)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-all-minilm-l6-v2

      - name: Build indexes + pages
        working-directory: packages/indexer
        run: node ../../node_modules/tsx/dist/cli.mjs src/build.ts ../../corpus.json ../../dist-data

      - name: Cache self-hosted model files
        uses: actions/cache@v4
        with:
          path: packages/web/public/models
          key: web-models-${{ hashFiles('scripts/fetch-models.mjs') }}

      - name: Download models
        run: node scripts/fetch-models.mjs

      - name: Build search app (base /search/)
        working-directory: packages/web
        run: npm run build

      - name: Assemble site
        run: |
          rm -rf site && mkdir site
          # Front page, detail pages, versions page, robots, css, favicon, index artifacts.
          cp -r dist-data/* site/
          # Search SPA at /search/ (drop the public copies it bundled).
          mkdir site/search
          cp -r packages/web/dist/* site/search/
          rm -rf site/search/models site/search/test-data

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update versions.json
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          BRANCH: ${{ steps.vars.outputs.branch }}
          MONTH: ${{ steps.vars.outputs.month }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, datetime
          bucket, branch, month, sha = (os.environ[k] for k in ('S3_BUCKET','BRANCH','MONTH','SHA'))
          try:
              out = subprocess.run(['aws','s3','cp',f's3://{bucket}/versions.json','-'],
                                   capture_output=True, text=True, check=True).stdout
              data = json.loads(out)
          except Exception:
              data = {'versions': []}
          vs = [v for v in data.get('versions', []) if not (v.get('branch')==branch and v.get('date')==month)]
          for v in vs:                      # past versions: not current, link to their snapshot
              if v.get('track'):            # dev-branch tracking entries own their /<branch>/ path
                  continue
              v['current'] = False
              v['path'] = f"/{v['branch']}/{v['date']}/"
          vs.append({'branch': branch, 'date': month, 'path': '/', 'current': True,
                     'sha': sha[:7], 'built': datetime.datetime.utcnow().isoformat()+'Z'})
          json.dump({'versions': vs}, open('site/versions.json','w'), indent=2)
          PY

      - name: Publish live site to bucket root
        run: |
          aws s3 sync site/ "s3://${{ vars.S3_BUCKET }}/" --delete \
            --exclude "models/*" --exclude "main/*" \
            --cache-control "public, max-age=300"

      - name: Snapshot for retention / rollback
        run: |
          aws s3 sync site/ "s3://${{ vars.S3_BUCKET }}/${{ steps.vars.outputs.prefix }}/" \
            --delete --cache-control "public, max-age=300"

      - name: Upload shared models
        run: |
          aws s3 sync packages/web/public/models/ "s3://${{ vars.S3_BUCKET }}/models/" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
