name: Deploy UAT to S3/CloudFront

# Builds the latest ontology and publishes it to the UAT bucket behind
# uat.themeontology.org. This is the app/tooling repo's own preview environment; the
# content repo (theme-ontology/theming) owns prod. Auth is GitHub OIDC (no stored keys).
#
# The build recipe (corpus -> indexes+pages -> models -> search app -> assemble -> publish)
# is intentionally kept identical to theming/.github/workflows/publish-prod.yml so the two
# stay in sync; only the env block (targets) and the release-matrix scaffolding differ.
#
# Site layout (served at the bucket root, version-less):
#   /                front page (intro + stats)
#   /search/         search SPA (built at base /search/)
#   /theme/, /story/ detail pages
#   /versions/       version listing (links rendered from /versions.json)
#   /latest.json, /minisearch.json, /*.bin   index artifacts
# Retention: each run also snapshots to /main/<month>/ for rollback.
# Shared (not per-version): /models/  (Hugging Face files).
#
# No repo configuration required: all targets are pinned in the env block below and auth
# is OIDC. The only sensitive thing (there are none here) would go in Secrets.

on:
  push:
    branches: [main]
    # Page-only changes (pages.ts) go through deploy-uat-pages.yml; SPA-only changes
    # (packages/web/**) go through deploy-uat-web.yml; docs and local scripts don't need a
    # deploy. A push that also touches the index (packages/core, packages/indexer beyond
    # pages.ts) still triggers this full build, which rebuilds the SPA too.
    paths-ignore:
      - 'packages/indexer/src/pages.ts'
      - 'packages/indexer/src/page-assets.ts'
      - 'packages/web/**'
      - 'scripts/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/**'   # workflow edits don't change site content; avoid clobbering pages
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-uat
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::777087578287:role/totolo-search-web-uat-deploy
  S3_BUCKET: totolo-web-uat
  CLOUDFRONT_DISTRIBUTION_ID: ENYYNF7Z2NR6D

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Check out main's tip, not the triggering commit, so a push that doesn't itself change
      # pages (e.g. build tooling) still deploys the LATEST pages and never clobbers a newer
      # page change with a stale copy.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute snapshot prefix
        id: vars
        run: |
          # The UAT root serves the latest theme-ontology build, whose source branch is
          # "master" (theming's default). Label it "master", not this app repo's branch.
          MONTH="$(date -u +%Y-%m)"
          echo "branch=master" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          echo "prefix=master/$MONTH" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install totolo

      - name: Generate corpus (latest)
        run: python -m totolo.util.makejson -tsc > corpus.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Cache HuggingFace models (build-time embeddings)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-all-minilm-l6-v2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Reuse the deployed embeddings when the corpus + model are unchanged (e.g. a push that
      # only touches the SPA/pages or tooling). Missing object -> full build. This is what
      # turns most UAT pushes from a ~20 min CPU embed into a ~2 min pages-only rebuild.
      - name: Fetch deployed root manifest
        run: aws s3 cp "s3://${{ env.S3_BUCKET }}/latest.json" prev-latest.json || echo "no previous manifest"

      - name: Build indexes + pages
        working-directory: packages/indexer
        env:
          SITE_BASE: ''
        run: node ../../node_modules/tsx/dist/cli.mjs src/build.ts ../../corpus.json ../../dist-data --prev-manifest ../../prev-latest.json

      - name: Build search app
        working-directory: packages/web
        env:
          APP_BASE: /search/
          VITE_LATEST_JSON_URL: /latest.json
          VITE_MODELS_URL: /models/
        run: npm run build

      - name: Assemble site
        run: |
          rm -rf site && mkdir site
          cp -r dist-data/* site/
          mkdir site/search
          cp -r packages/web/dist/* site/search/
          rm -rf site/search/models site/search/test-data

      - name: Update versions.json (main = current root)
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
          MONTH: ${{ steps.vars.outputs.month }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, datetime
          bucket = os.environ['S3_BUCKET']
          branch, month, sha = (os.environ[k] for k in ('BRANCH','MONTH','SHA'))
          try:
              out = subprocess.run(['aws','s3','cp',f's3://{bucket}/versions.json','-'],
                                   capture_output=True, text=True, check=True).stdout
              data = json.loads(out)
          except Exception:
              data = {'versions': []}
          # Display date = the ontology's source timestamp (master's last commit), from the corpus.
          try:
              src = json.load(open('corpus.json')).get('lto', {}).get('timestamp', '')
              src_date = src[:10] if src else month
          except Exception:
              src_date = month
          # Maintain a single current root entry for the live master build; leave any other rows
          # (release / branch entries) untouched. Monthly snapshots still go to S3 for rollback.
          vs = [v for v in data.get('versions', []) if not (v.get('branch')==branch and v.get('path')=='/')]
          vs.append({'branch': branch, 'date': src_date, 'path': '/', 'current': True,
                     'sha': sha[:7], 'built': datetime.datetime.utcnow().isoformat()+'Z'})
          json.dump({'versions': vs}, open('site/versions.json','w'), indent=2)
          PY

      - name: Publish live site to bucket root
        run: |
          # Mutable "latest" root: 1h edge TTL (every deploy invalidates /* so it stays fresh),
          # which keeps far-edge users served from cache instead of round-tripping to eu-west-1.
          BUCKET="${{ env.S3_BUCKET }}"; CC="public, max-age=3600"
          # Reuse-safe publish: top-level files use --size-only with NO --delete, so the
          # embeddings index artifacts (not regenerated when the corpus is unchanged) and the
          # /models/ + /master/ prefixes sharing the root all survive. Each page subtree this
          # build fully owns gets a scoped --delete to drop stale entries.
          aws s3 sync site/ "s3://$BUCKET/" --size-only \
            --exclude "*/*" --exclude "versions.json" --cache-control "$CC"
          for dir in theme story search versions stats; do
            aws s3 sync "site/$dir/" "s3://$BUCKET/$dir/" --delete --size-only --cache-control "$CC"
          done
          # Force-upload small template-driven files (--size-only can miss same-size edits).
          # search/index.html especially: when only the JS bundle changes, the SPA HTML stays
          # the same byte length (asset hash is fixed-width) so --size-only would skip it and
          # leave it pointing at the just-deleted old bundle (404). Always refresh it.
          for f in index.html pages.css pages.js robots.txt favicon.svg versions/index.html search/index.html stats/index.html stats/themes-graph/index.html stats/most-used/index.html stats/stories-by-year/index.html; do
            [ -f "site/$f" ] && aws s3 cp "site/$f" "s3://$BUCKET/$f" --cache-control "$CC"
          done
          # versions.json is this job's index of live builds — always refresh it, no-cache.
          [ -f site/versions.json ] && aws s3 cp site/versions.json "s3://$BUCKET/versions.json" --cache-control "no-cache"

      - name: Snapshot for retention / rollback
        run: |
          BUCKET="${{ env.S3_BUCKET }}"
          # On a reuse build the embeddings .bin files aren't regenerated locally; pull the
          # deployed copies into site/ so the rollback snapshot stays self-contained.
          if [ -f dist-data/.reused-embeddings ]; then
            for b in embeddings.bin embeddings-annotations.bin; do
              aws s3 cp "s3://$BUCKET/$b" "site/$b" || true
            done
          fi
          aws s3 sync site/ "s3://$BUCKET/${{ steps.vars.outputs.prefix }}/" --delete \
            --cache-control "public, max-age=3600"

      - name: Invalidate CloudFront
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
