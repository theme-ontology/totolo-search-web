name: Deploy UAT to S3/CloudFront

# Builds the latest ontology and publishes it to the UAT bucket behind
# uat.themeontology.org. This is the app/tooling repo's own preview environment; the
# content repo (theme-ontology/theming) owns prod. Auth is GitHub OIDC (no stored keys).
#
# The build recipe (corpus -> indexes+pages -> models -> search app -> assemble -> publish)
# is intentionally kept identical to theming/.github/workflows/publish-prod.yml so the two
# stay in sync; only the env block (targets) and the release-matrix scaffolding differ.
#
# Site layout (served at the bucket root, version-less):
#   /                front page (intro + stats)
#   /search/         search SPA (built at base /search/)
#   /theme/, /story/ detail pages
#   /versions/       version listing (links rendered from /versions.json)
#   /latest.json, /minisearch.json, /*.bin   index artifacts
# Retention: each run also snapshots to /main/<month>/ for rollback.
# Shared (not per-version): /models/  (Hugging Face files).
#
# No repo configuration required: all targets are pinned in the env block below and auth
# is OIDC. The only sensitive thing (there are none here) would go in Secrets.

on:
  push:
    branches: [main]
    # Page-only changes (pages.ts) go through the fast deploy-uat-pages.yml instead; docs
    # and local scripts don't need a deploy. A push that also touches index/search code
    # still triggers this full build.
    paths-ignore:
      - 'packages/indexer/src/pages.ts'
      - 'scripts/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/**'   # workflow edits don't change site content; avoid clobbering pages
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-uat
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::777087578287:role/totolo-search-web-uat-deploy
  S3_BUCKET: totolo-web-uat
  CLOUDFRONT_DISTRIBUTION_ID: ENYYNF7Z2NR6D

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Check out main's tip, not the triggering commit, so a push that doesn't itself change
      # pages (e.g. build tooling) still deploys the LATEST pages and never clobbers a newer
      # page change with a stale copy.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute snapshot prefix
        id: vars
        run: |
          # The UAT root serves the latest theme-ontology build, whose source branch is
          # "master" (theming's default). Label it "master", not this app repo's branch.
          MONTH="$(date -u +%Y-%m)"
          echo "branch=master" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          echo "prefix=master/$MONTH" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install totolo

      - name: Generate corpus (latest)
        run: python -m totolo.util.makejson -tsc > corpus.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Cache HuggingFace models (build-time embeddings)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-all-minilm-l6-v2

      - name: Build indexes + pages
        working-directory: packages/indexer
        env:
          SITE_BASE: ''
        run: node ../../node_modules/tsx/dist/cli.mjs src/build.ts ../../corpus.json ../../dist-data

      - name: Build search app
        working-directory: packages/web
        env:
          APP_BASE: /search/
          VITE_LATEST_JSON_URL: /latest.json
          VITE_MODELS_URL: /models/
        run: npm run build

      - name: Assemble site
        run: |
          rm -rf site && mkdir site
          cp -r dist-data/* site/
          mkdir site/search
          cp -r packages/web/dist/* site/search/
          rm -rf site/search/models site/search/test-data

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update versions.json (main = current root)
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
          MONTH: ${{ steps.vars.outputs.month }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, datetime
          bucket = os.environ['S3_BUCKET']
          branch, month, sha = (os.environ[k] for k in ('BRANCH','MONTH','SHA'))
          try:
              out = subprocess.run(['aws','s3','cp',f's3://{bucket}/versions.json','-'],
                                   capture_output=True, text=True, check=True).stdout
              data = json.loads(out)
          except Exception:
              data = {'versions': []}
          # Display date = the ontology's source timestamp (master's last commit), from the corpus.
          try:
              src = json.load(open('corpus.json')).get('lto', {}).get('timestamp', '')
              src_date = src[:10] if src else month
          except Exception:
              src_date = month
          # Maintain a single current root entry for the live master build; leave any other rows
          # (release / branch entries) untouched. Monthly snapshots still go to S3 for rollback.
          vs = [v for v in data.get('versions', []) if not (v.get('branch')==branch and v.get('path')=='/')]
          vs.append({'branch': branch, 'date': src_date, 'path': '/', 'current': True,
                     'sha': sha[:7], 'built': datetime.datetime.utcnow().isoformat()+'Z'})
          json.dump({'versions': vs}, open('site/versions.json','w'), indent=2)
          PY

      - name: Publish live site to bucket root
        run: |
          aws s3 sync site/ "s3://${{ env.S3_BUCKET }}/" --delete \
            --exclude "models/*" --exclude "master/*" \
            --cache-control "public, max-age=300"

      - name: Snapshot for retention / rollback
        run: |
          aws s3 sync site/ "s3://${{ env.S3_BUCKET }}/${{ steps.vars.outputs.prefix }}/" --delete \
            --cache-control "public, max-age=300"

      - name: Invalidate CloudFront
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
