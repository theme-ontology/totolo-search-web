name: Deploy models to UAT (shared /models/)

# Publishes the self-hosted browser model files (transformers.js embedder + reranker) to the
# shared s3://totolo-web-uat/models/ prefix. These are version-independent "libraries" with
# nothing to do with the theming-data lifecycle, so they live here -- NOT in each version
# build. Run on demand, or automatically when the model set (scripts/fetch-models.mjs) changes.
# The theming/version builds just reference /models/ and never re-upload it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-models.mjs']

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-models-uat
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::777087578287:role/totolo-search-web-uat-deploy
  S3_BUCKET: totolo-web-uat
  CLOUDFRONT_DISTRIBUTION_ID: ENYYNF7Z2NR6D

jobs:
  deploy-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download browser models
        run: node scripts/fetch-models.mjs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to shared /models/
        run: |
          aws s3 sync packages/web/public/models/ "s3://${{ env.S3_BUCKET }}/models/" \
            --delete --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate /models/
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/models/*"
