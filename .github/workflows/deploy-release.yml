name: Deploy release(s) to S3/CloudFront (prod)

# Builds a self-contained site for one or more LTO releases and publishes each under
# its own immutable prefix in the PROD bucket, e.g.
#   s3://totolo-web-prod/v2025.04/  ->  prod.themeontology.org/v2025.04/
# The newest release additionally mirrors to the bucket root, so prod.themeontology.org/
# always serves the latest release ("root tracks latest").
#
# Triggers:
#   - pushing a v* tag        -> build that release; it becomes the new root
#   - workflow_dispatch input -> a single tag (e.g. v2025.04), or "all" to backfill every
#     release returned by totolo.remote.versions(); the max version becomes root
#
# Release content never changes, so /<tag>/ is cached immutably; the shared /models/
# prefix is reused. The root mirror and /versions.json use a short TTL. /versions.json
# (at the bucket root, shared by every release + the root) is updated once, after all
# builds, to list the releases.
#
# Requires repo Variables: AWS_DEPLOY_ROLE_ARN, AWS_REGION.
# Prod bucket + distribution are pinned below (stable infra).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v2025.04), or "all" to backfill every release'
        required: true
        default: all

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROD_BUCKET: totolo-web-prod
  PROD_DISTRIBUTION_ID: E18HZDKQXC49C4

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
      latest: ${{ steps.list.outputs.latest }}
      deploy_root: ${{ steps.list.outputs.deploy_root }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install totolo
      - id: list
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          import totolo
          event = os.environ.get('GITHUB_EVENT_NAME', '')
          ref = os.environ.get('GITHUB_REF_NAME', '')
          inp = (os.environ.get('INPUT_VERSION') or '').strip()

          all_releases = [v for v, _ in totolo.remote.versions()]

          def vkey(tag):
              out = []
              for part in tag.lstrip('v').split('.'):
                  try:
                      out.append(int(part))
                  except ValueError:
                      out.append(0)
              return out

          if event == 'push':
              # A deliberate release tag on this repo: build it and make it the new root.
              versions = [ref]
              latest = ref
              deploy_root = 'true'
          else:
              if inp == 'all':
                  versions = all_releases
              elif inp:
                  versions = [inp]
              else:
                  versions = []
              latest = max(all_releases, key=vkey) if all_releases else ''
              # Only refresh root when the true latest is among what we're (re)building,
              # so dispatching an older tag never clobbers the root.
              deploy_root = 'true' if latest and latest in versions else 'false'

          print('versions=' + json.dumps(versions))
          print('latest=' + latest)
          print('deploy_root=' + deploy_root)
          PY

  deploy:
    needs: prepare
    if: ${{ needs.prepare.outputs.versions != '[]' && needs.prepare.outputs.versions != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install totolo

      - name: Generate corpus for ${{ matrix.version }}
        run: python -m totolo.util.makejson -tsc "${{ matrix.version }}" > corpus.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Cache HuggingFace models (build-time embeddings)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-all-minilm-l6-v2

      - name: Build indexes + pages
        working-directory: packages/indexer
        env:
          SITE_BASE: /${{ matrix.version }}
        run: node ../../node_modules/tsx/dist/cli.mjs src/build.ts ../../corpus.json ../../dist-data

      - name: Cache self-hosted model files
        uses: actions/cache@v4
        with:
          path: packages/web/public/models
          key: web-models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - name: Download models
        run: node scripts/fetch-models.mjs

      - name: Build search app
        working-directory: packages/web
        env:
          APP_BASE: /${{ matrix.version }}/search/
          VITE_LATEST_JSON_URL: /${{ matrix.version }}/latest.json
          VITE_MODELS_URL: /models/
        run: npm run build

      - name: Assemble site
        run: |
          rm -rf site && mkdir site
          cp -r dist-data/* site/
          mkdir site/search
          cp -r packages/web/dist/* site/search/
          rm -rf site/search/models site/search/test-data

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish release (immutable)
        run: |
          aws s3 sync site/ "s3://${{ env.PROD_BUCKET }}/${{ matrix.version }}/" --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload shared models
        run: |
          aws s3 sync packages/web/public/models/ "s3://${{ env.PROD_BUCKET }}/models/" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate this release path
        if: ${{ env.PROD_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.PROD_DISTRIBUTION_ID }}" \
            --paths "/${{ matrix.version }}/*"

  # Mirror the newest release to the bucket root so prod.themeontology.org/ tracks latest.
  # Built root-relative (SITE_BASE empty, APP_BASE /search/). The root sync preserves the
  # per-release /<tag>/ prefixes, /models/, and the shared /versions.json.
  deploy-root:
    needs: [prepare, deploy]
    if: ${{ needs.prepare.outputs.deploy_root == 'true' && needs.prepare.outputs.latest != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install totolo

      - name: Generate corpus for ${{ needs.prepare.outputs.latest }}
        run: python -m totolo.util.makejson -tsc "${{ needs.prepare.outputs.latest }}" > corpus.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Cache HuggingFace models (build-time embeddings)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-all-minilm-l6-v2

      - name: Build indexes + pages (root-relative)
        working-directory: packages/indexer
        env:
          SITE_BASE: ''
        run: node ../../node_modules/tsx/dist/cli.mjs src/build.ts ../../corpus.json ../../dist-data

      - name: Cache self-hosted model files
        uses: actions/cache@v4
        with:
          path: packages/web/public/models
          key: web-models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - name: Download models
        run: node scripts/fetch-models.mjs

      - name: Build search app (root)
        working-directory: packages/web
        env:
          APP_BASE: /search/
          VITE_LATEST_JSON_URL: /latest.json
          VITE_MODELS_URL: /models/
        run: npm run build

      - name: Assemble site
        run: |
          rm -rf site && mkdir site
          cp -r dist-data/* site/
          mkdir site/search
          cp -r packages/web/dist/* site/search/
          rm -rf site/search/models site/search/test-data

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish latest release to bucket root
        run: |
          # --delete cleans stale root files from a previous latest, but the filters keep
          # the per-release prefixes (v*/), /models/, and the shared /versions.json. The
          # root's own /versions/ page dir is re-included (it also matches v*/).
          aws s3 sync site/ "s3://${{ env.PROD_BUCKET }}/" --delete \
            --exclude "models/*" --exclude "versions.json" \
            --exclude "v*/*" --include "versions/*" \
            --cache-control "public, max-age=300"

      - name: Invalidate root
        if: ${{ env.PROD_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.PROD_DISTRIBUTION_ID }}" \
            --paths "/" "/index.html" "/search/*" "/theme/*" "/story/*" \
                    "/versions/*" "/latest.json" "/*.json" "/*.bin"

  finalize:
    needs: [prepare, deploy]
    if: ${{ needs.prepare.outputs.versions != '[]' && needs.prepare.outputs.versions != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Update versions.json with release entries
        env:
          S3_BUCKET: ${{ env.PROD_BUCKET }}
          VERSIONS: ${{ needs.prepare.outputs.versions }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, datetime
          bucket = os.environ['S3_BUCKET']
          tags = json.loads(os.environ['VERSIONS'])
          latest = os.environ.get('LATEST', '')
          try:
              out = subprocess.run(['aws','s3','cp',f's3://{bucket}/versions.json','-'],
                                   capture_output=True, text=True, check=True).stdout
              data = json.loads(out)
          except Exception:
              data = {'versions': []}
          vs = [v for v in data.get('versions', []) if not (v.get('release') and v.get('tag') in tags)]
          for tag in tags:
              vs.append({'release': True, 'tag': tag, 'path': f'/{tag}/',
                         'built': datetime.datetime.utcnow().isoformat() + 'Z'})
          # Mark which release the bucket root currently mirrors.
          for v in vs:
              if v.get('release'):
                  v['current'] = (v.get('tag') == latest)
          json.dump({'versions': vs}, open('versions.json', 'w'), indent=2)
          PY
          aws s3 cp versions.json "s3://${{ env.PROD_BUCKET }}/versions.json" --cache-control "no-cache"
      - name: Invalidate versions list
        if: ${{ env.PROD_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.PROD_DISTRIBUTION_ID }}" \
            --paths "/versions.json" "/versions/*"
