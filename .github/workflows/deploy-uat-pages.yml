name: Deploy UAT pages (fast, no index rebuild)

# Fast lane for static-page / CSS changes (packages/indexer/src/pages.ts). It re-renders the
# front / theme / story / versions pages + pages.css and uploads just those files. Skips the
# slow parts of a full deploy -- title/annotation embeddings, model download, and the
# search-app (Vite) build -- so it runs in ~2 min vs ~8. The index artifacts
# (minisearch.json, embeddings*.bin, latest.json, corpus.json) and /models/ and /search/ in
# the bucket are untouched (no --delete; dist-data only holds page files here).
#
# Page rendering needs the RAW corpus ({themes,stories,collections}); the corpus.json in the
# bucket is the transformed Document[] for the search app, so we regenerate the raw corpus
# with makejson rather than reuse the deployed one.
#
# Auto-runs when only pages.ts changes on main, and can be dispatched manually. Anything that
# touches the index/search app still goes through the full deploy-uat.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/indexer/src/pages.ts']

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-uat-pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::777087578287:role/totolo-search-web-uat-deploy
  S3_BUCKET: totolo-web-uat
  CLOUDFRONT_DISTRIBUTION_ID: ENYYNF7Z2NR6D

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always render the latest pages, not the triggering commit
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install totolo

      - name: Generate raw corpus (latest ontology)
        run: python -m totolo.util.makejson -tsc > corpus.json

      - name: Re-render pages (no index rebuild)
        run: npm run pages   # tsx build.ts corpus.json dist-data --pages-only

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload page files only
        # dist-data holds only page output here (no index artifacts), so a plain sync
        # without --delete touches nothing else in the bucket. --size-only skips the
        # thousands of unchanged per-doc HTML files, uploading just what changed.
        run: |
          # 1h edge TTL on the mutable root (page paths are invalidated below on every run),
          # so far-edge users are served from cache instead of round-tripping to eu-west-1.
          BUCKET="${{ env.S3_BUCKET }}"; CC="public, max-age=3600"
          aws s3 sync dist-data/ "s3://$BUCKET/" --size-only --cache-control "$CC"
          # --size-only can miss a same-size content edit (e.g. reordering two tokens), which
          # mostly affects the small template-driven files. Force-upload those every time.
          for f in index.html pages.css pages.js robots.txt favicon.svg versions/index.html themes-graph/index.html; do
            [ -f "dist-data/$f" ] && aws s3 cp "dist-data/$f" "s3://$BUCKET/$f" --cache-control "$CC"
          done

      - name: Invalidate page paths
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/" "/index.html" "/pages.css" "/pages.js" \
                    "/theme/*" "/story/*" "/versions/*" \
                    "/themes-graph/*" "/themes-graph.json"
