name: Deploy branch snapshot to UAT

# Builds a self-contained search site from a tracked branch of the theme-ontology/theming
# repo and publishes it to the UAT bucket under uat.themeontology.org/<branch>/. Triggered
# by a repository_dispatch (event_type=track-branch) sent from the theming repo whenever
# commits land on a tracked branch; can also be run manually for any branch.
#
# Branch snapshots are dev previews -> UAT bucket (releases go to prod via deploy-release).
# Content changes over time, so /<branch>/ is served with a short TTL (not immutable).
#
# Requires repo Variables: AWS_DEPLOY_ROLE_ARN, AWS_REGION, S3_BUCKET (uat),
# CLOUDFRONT_DISTRIBUTION_ID (uat).

on:
  repository_dispatch:
    types: [track-branch]
  workflow_dispatch:
    inputs:
      branch:
        description: 'theming branch to publish (e.g. dev-themes)'
        required: true
        default: dev-themes

permissions:
  contents: read
  id-token: write

concurrency:
  # One in-flight build per branch; newer pushes supersede older ones.
  group: deploy-branch-${{ github.event.client_payload.ref || github.event.inputs.branch }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BRANCH: ${{ github.event.client_payload.ref || github.event.inputs.branch }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          # Guard the value that flows into S3 keys / paths (it comes from a dispatch payload).
          if ! echo "$BRANCH" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "Refusing unsafe branch name: '$BRANCH'"; exit 1
          fi
          echo "Building snapshot for branch: $BRANCH"

      - name: Check out totolo-search-web
        uses: actions/checkout@v4

      - name: Check out theming@${{ env.BRANCH }}
        uses: actions/checkout@v4
        with:
          repository: theme-ontology/theming
          ref: ${{ env.BRANCH }}
          path: theming

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install totolo

      - name: Generate corpus from theming/notes
        run: python -m totolo.util.makejson -tsc theming/notes > corpus.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Cache HuggingFace models (build-time embeddings)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-all-minilm-l6-v2

      - name: Build indexes + pages
        working-directory: packages/indexer
        env:
          SITE_BASE: /${{ env.BRANCH }}
        run: node ../../node_modules/tsx/dist/cli.mjs src/build.ts ../../corpus.json ../../dist-data

      - name: Cache self-hosted model files
        uses: actions/cache@v4
        with:
          path: packages/web/public/models
          key: web-models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - name: Download models
        run: node scripts/fetch-models.mjs

      - name: Build search app
        working-directory: packages/web
        env:
          APP_BASE: /${{ env.BRANCH }}/search/
          VITE_LATEST_JSON_URL: /${{ env.BRANCH }}/latest.json
          VITE_MODELS_URL: /models/
        run: npm run build

      - name: Assemble site
        run: |
          rm -rf site && mkdir site
          cp -r dist-data/* site/
          mkdir site/search
          cp -r packages/web/dist/* site/search/
          rm -rf site/search/models site/search/test-data

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish branch snapshot
        run: |
          aws s3 sync site/ "s3://${{ vars.S3_BUCKET }}/${{ env.BRANCH }}/" --delete \
            --cache-control "public, max-age=300"

      - name: Upload shared models
        run: |
          aws s3 sync packages/web/public/models/ "s3://${{ vars.S3_BUCKET }}/models/" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Update versions.json with this branch
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, datetime
          bucket = os.environ['S3_BUCKET']
          branch = os.environ['BRANCH']
          try:
              out = subprocess.run(['aws','s3','cp',f's3://{bucket}/versions.json','-'],
                                   capture_output=True, text=True, check=True).stdout
              data = json.loads(out)
          except Exception:
              data = {'versions': []}
          # Replace any prior entry for this tracked branch (one row per branch, at /<branch>/).
          vs = [v for v in data.get('versions', [])
                if not (v.get('branch') == branch and v.get('path') == f'/{branch}/')]
          vs.append({'branch': branch, 'date': datetime.date.today().isoformat(),
                     'path': f'/{branch}/', 'current': False, 'track': True,
                     'built': datetime.datetime.utcnow().isoformat() + 'Z'})
          json.dump({'versions': vs}, open('versions.json', 'w'), indent=2)
          PY
          aws s3 cp versions.json "s3://${{ vars.S3_BUCKET }}/versions.json" --cache-control "no-cache"

      - name: Invalidate branch path + versions list
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/${{ env.BRANCH }}/*" "/versions.json" "/versions/*"
