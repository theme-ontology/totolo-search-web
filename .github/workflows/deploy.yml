name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install totolo
        run: pip install totolo

      - name: Generate corpus
        run: python -m totolo.util.makejson -tsc > corpus.json

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-all-minilm-l6-v2

      - name: Build indexes
        working-directory: packages/indexer
        run: node ../../node_modules/tsx/dist/cli.mjs src/build.ts ../../corpus.json ../../dist-data

      - name: Patch index_prefix for GitHub Pages
        run: |
          python3 -c "
          import json
          with open('dist-data/latest.json') as f: m = json.load(f)
          m['index_prefix'] = '/totolo-search-web'
          with open('dist-data/latest.json', 'w') as f: json.dump(m, f, indent=2)
          "

      - name: Build web app
        working-directory: packages/web
        env:
          APP_BASE: /totolo-search-web/
          VITE_LATEST_JSON_URL: /totolo-search-web/latest.json
        run: npm run build

      - name: Copy index artifacts into dist
        run: cp dist-data/* packages/web/dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
