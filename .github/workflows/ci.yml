name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build core
        run: npm run build:core

      - name: Type-check indexer
        run: npx tsc --noEmit -p packages/indexer

      - name: Type-check web
        run: npx tsc --noEmit -p packages/web

      - name: Test
        run: npm test
